# py-conflict-resolver configuration
# Edit this file to change the LLM provider, model, and agent settings.

[llm]
# Provider: "openai" | "anthropic" | "gemini"
provider = "openai"

# Model name — must be one of the entries in [models.<provider>].available below
model = "gpt-4.1"

# LLM temperature (0.0 = deterministic, 1.0 = creative)
temperature = 0.2

[agent]
# Maximum number of install+fix iterations before giving up
max_loops = 10

# ─── Available models (for reference and validation) ──────────────────────────
# To use a different model, change [llm].provider and [llm].model above.
# The lists below act as an allowlist; adding a model here is required before
# you can select it.

[models.openai]
# Requires env var: OPENAI_API_KEY
available = [
    "gpt-4.1",
    "gpt-4.1-mini",
    "gpt-4o",
    "gpt-4o-mini",
    "o3",
    "o4-mini",
]

[models.anthropic]
# Requires env var: ANTHROPIC_API_KEY
available = [
    "claude-opus-4-6",
    "claude-sonnet-4-6",
    "claude-haiku-4-5-20251001",
]

[models.gemini]
# Requires env var: GOOGLE_API_KEY
available = [
    "gemini-2.5-pro",
    "gemini-2.5-flash",
    "gemini-2.0-flash",
]
