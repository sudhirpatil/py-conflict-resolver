[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-conflict-resolver"
version = "0.1.0"
description = "Resolve Python package version conflicts using LLM agents"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nooa>=0.0.8",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
]

[project.scripts]
conflict-resolver = "conflict_resolver.cli:main"
conflict-resolver-web = "conflict_resolver.web.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/conflict_resolver"]
