<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>py-conflict-resolver</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f3f4f6;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #6d28d9;
      margin-bottom: 0.25rem;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 1.75rem;
      width: 100%;
      max-width: 820px;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    .card h2 {
      font-size: 0.8rem;
      font-weight: 600;
      color: #7c3aed;
      margin-bottom: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.82rem;
      color: #374151;
      font-weight: 500;
    }

    select,
    input[type="text"],
    input[type="number"] {
      background: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      color: #111827;
      padding: 0.5rem 0.75rem;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    select:focus,
    input:focus {
      border-color: #7c3aed;
    }

    .upload-area {
      border: 2px dashed #d1d5db;
      border-radius: 10px;
      padding: 1.8rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 1rem;
      position: relative;
    }

    .upload-area:hover,
    .upload-area.drag-over {
      border-color: #7c3aed;
      background: #f5f3ff;
    }

    .upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .upload-label {
      color: #6b7280;
      font-size: 0.9rem;
    }

    .upload-label span {
      color: #7c3aed;
    }

    #file-name {
      margin-top: 0.5rem;
      font-size: 0.82rem;
      color: #059669;
      min-height: 1.1em;
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
    }

    /* Logs */
    #log-card {
      display: none;
    }

    .log-box {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 1rem;
      height: 320px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.78rem;
      line-height: 1.55;
      scroll-behavior: smooth;
    }

    .log-line {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-INFO {
      color: #9ca3af;
    }

    .log-DEBUG {
      color: #d1d5db;
      opacity: 0.5;
    }

    .log-WARNING {
      color: #d97706;
    }

    .log-ERROR {
      color: #dc2626;
    }

    .log-pip {
      color: #9ca3af;
      opacity: 0.6;
    }

    /* Logs from conflict_resolver — prominent blue */
    .log-agent {
      color: sandybrown;
      font-weight: 400;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #7c3aed;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Result */
    #result-card {
      display: none;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.7rem;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .badge-success {
      background: #d1fae5;
      color: #065f46;
    }

    .badge-fail {
      background: #fee2e2;
      color: #991b1b;
    }

    .section-label {
      font-size: 0.78rem;
      color: #6b7280;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 1rem 0 0.4rem;
    }

    .diff-box,
    .text-box {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.78rem;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
      max-height: 360px;
      overflow-y: auto;
      line-height: 1.55;
    }

    .diff-add {
      color: #065f46;
    }

    .diff-rem {
      color: #dc2626;
    }

    .diff-hdr {
      color: #2563eb;
    }

    .diff-meta {
      color: #9ca3af;
    }

    .download-btn {
      margin-top: 1rem;
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
      border-radius: 7px;
      padding: 0.5rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .download-btn:hover {
      background: #a7f3d0;
    }

    /* Manual fix card */
    .info-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      font-size: 0.85rem;
      color: #1e40af;
      margin-bottom: 0.75rem;
      line-height: 1.6;
    }

    .warn-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 0.85rem 1rem;
      font-size: 0.85rem;
      color: #92400e;
      margin-bottom: 0.75rem;
      line-height: 1.6;
    }

    .rec-block {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 1rem 1.1rem;
      margin-bottom: 0.85rem;
      background: #f9fafb;
    }

    .rec-title {
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .rec-steps {
      margin: 0;
      padding-left: 1.3rem;
      color: #374151;
      font-size: 0.85rem;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <h1>py-conflict-resolver</h1>
  <p class="subtitle">Resolve Python package version conflicts with an LLM agent</p>

  <!-- Config card -->
  <div class="card">
    <h2>Configuration</h2>

    <div class="form-row">
      <div class="form-group">
        <label for="provider">LLM Provider</label>
        <select id="provider">
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic</option>
          <option value="gemini">Gemini</option>
        </select>
      </div>
      <div class="form-group">
        <label for="model">Model</label>
        <select id="model"></select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="max-loops">Max Loops</label>
        <input type="number" id="max-loops" value="10" min="1" max="50" />
      </div>
      <div class="form-group">
        <label for="python-version">Python Version (optional)</label>
        <input type="text" id="python-version" placeholder="e.g. 3.11 or python3.12" />
      </div>
    </div>
  </div>

  <!-- Upload card -->
  <div class="card">
    <h2>Upload requirements.txt</h2>
    <div class="upload-area" id="upload-area">
      <input type="file" id="file-input" accept=".txt" />
      <div class="upload-icon">📄</div>
      <p class="upload-label">Drop your <span>requirements.txt</span> here, or click to browse</p>
      <p id="file-name"></p>
    </div>
    <button class="btn btn-primary" id="run-btn" disabled>Run Conflict Resolver</button>
  </div>

  <!-- Logs card -->
  <div class="card" id="log-card">
    <h2>Agent Logs</h2>
    <h2 id="log-title"><span class="spinner" id="spinner"></span> Agent running…</h2>
    <div class="log-box" id="log-box"></div>
  </div>

  <!-- Result card -->
  <div class="card" id="result-card">
    <h2>Result</h2>
    <div id="result-content"></div>
  </div>

  <!-- Manual fix recommendations card -->
  <div class="card" id="manual-card" style="display:none">
    <h2>Manual Fix Recommendations</h2>
    <div id="manual-content"></div>
  </div>

  <script>
    // ── Model lists ──────────────────────────────────────────────────────────
    const MODELS = {
      openai: ["gpt-4.1", "gpt-4.1-mini", "gpt-4o", "gpt-4o-mini", "o3", "o4-mini"],
      anthropic: ["claude-opus-4-6", "claude-sonnet-4-6", "claude-haiku-4-5-20251001"],
      gemini: ["gemini-2.5-pro", "gemini-2.5-flash", "gemini-2.0-flash"],
    };

    const providerEl = document.getElementById("provider");
    const modelEl = document.getElementById("model");

    function populateModels() {
      const provider = providerEl.value;
      modelEl.innerHTML = MODELS[provider].map(m =>
        `<option value="${m}">${m}</option>`
      ).join("");
    }

    providerEl.addEventListener("change", populateModels);
    populateModels();

    // ── File upload ──────────────────────────────────────────────────────────
    const fileInput = document.getElementById("file-input");
    const uploadArea = document.getElementById("upload-area");
    const fileNameEl = document.getElementById("file-name");
    const runBtn = document.getElementById("run-btn");

    fileInput.addEventListener("change", () => {
      const f = fileInput.files[0];
      if (f) {
        fileNameEl.textContent = `✓ ${f.name}`;
        runBtn.disabled = false;
      }
    });

    uploadArea.addEventListener("dragover", e => { e.preventDefault(); uploadArea.classList.add("drag-over"); });
    uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("drag-over"));
    uploadArea.addEventListener("drop", e => {
      e.preventDefault();
      uploadArea.classList.remove("drag-over");
      const f = e.dataTransfer.files[0];
      if (f) {
        const dt = new DataTransfer();
        dt.items.add(f);
        fileInput.files = dt.files;
        fileNameEl.textContent = `✓ ${f.name}`;
        runBtn.disabled = false;
      }
    });

    // ── Run ──────────────────────────────────────────────────────────────────
    const logCard = document.getElementById("log-card");
    const logBox = document.getElementById("log-box");
    const logTitle = document.getElementById("log-title");
    const spinner = document.getElementById("spinner");
    const resultCard = document.getElementById("result-card");
    const resultEl = document.getElementById("result-content");

    function logClass(text) {
      if (text.startsWith("pip:")) return "log-pip";
      if (text.includes("conflict_resolver")) return "log-agent";
      if (text.startsWith("DEBUG")) return "log-DEBUG";
      if (text.startsWith("WARNING")) return "log-WARNING";
      if (text.startsWith("ERROR")) return "log-ERROR";
      return "log-INFO";
    }

    function appendLog(text) {
      const div = document.createElement("div");
      div.className = `log-line ${logClass(text)}`;
      div.textContent = text;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function renderDiff(diffText) {
      if (!diffText.trim()) return '<span style="color:#6b7280">(no changes)</span>';
      return diffText.split("\n").map(line => {
        if (line.startsWith("+") && !line.startsWith("+++"))
          return `<span class="diff-add">${escHtml(line)}</span>`;
        if (line.startsWith("-") && !line.startsWith("---"))
          return `<span class="diff-rem">${escHtml(line)}</span>`;
        if (line.startsWith("@@"))
          return `<span class="diff-hdr">${escHtml(line)}</span>`;
        if (line.startsWith("---") || line.startsWith("+++"))
          return `<span class="diff-meta">${escHtml(line)}</span>`;
        return `<span>${escHtml(line)}</span>`;
      }).join("\n");
    }

    function escHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function showResult(data) {
      spinner.style.display = "none";
      resultCard.style.display = "block";

      if (data.success) {
        logTitle.innerHTML = "✅ Conflict resolved";

        let html = `<span class="badge badge-success">✓ Resolved</span>`;

        html += `<p class="section-label">Diff — original vs resolved</p>`;
        html += `<div class="diff-box">${renderDiff(data.diff)}</div>`;

        html += `<p class="section-label">Resolved requirements.txt</p>`;
        html += `<div class="text-box">${escHtml(data.resolved)}</div>`;

        const blob = new Blob([data.resolved], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        html += `<a href="${url}" download="requirements.resolved.txt">
                   <button class="download-btn">⬇ Download requirements.resolved.txt</button>
                 </a>`;

        resultEl.innerHTML = html;

      } else {
        logTitle.innerHTML = "❌ Could not resolve conflicts";

        let html = `<span class="badge badge-fail">✗ Failed</span>`;
        html += `<p style="color:#dc2626;margin-bottom:0.75rem">${escHtml(data.error_message)}</p>`;

        if (data.last_pip_errors) {
          html += `<p class="section-label">Last pip errors</p>`;
          html += `<div class="text-box" style="color:#dc2626">${escHtml(data.last_pip_errors)}</div>`;
        }

        if (data.attempts_summary) {
          html += `<p class="section-label">Changes tried per attempt</p>`;
          html += `<div class="text-box">${escHtml(data.attempts_summary)}</div>`;
        }

        resultEl.innerHTML = html;
      }

      showManualFix(data.manual_fix || "{}");
    }

    function showManualFix(rawJson) {
      const manualCard = document.getElementById("manual-card");
      const manualEl = document.getElementById("manual-content");
      manualCard.style.display = "block";

      let data;
      try { data = JSON.parse(rawJson); } catch (_) {
        manualEl.innerHTML = `<p style="color:#6b7280">No recommendations available.</p>`;
        return;
      }

      let html = "";

      if (data.issue_summary) {
        html += `<p class="section-label">Issue Summary</p>
                 <div class="info-box">${escHtml(data.issue_summary)}</div>`;
      }
      if (data.root_cause) {
        html += `<p class="section-label">Root Cause</p>
                 <div class="warn-box">${escHtml(data.root_cause)}</div>`;
      }
      if (data.recommendations && data.recommendations.length) {
        html += `<p class="section-label">How to Fix Manually</p>`;
        for (const rec of data.recommendations) {
          const steps = (rec.steps || []).map(s => `<li>${escHtml(s)}</li>`).join("");
          html += `<div class="rec-block">
                     <div class="rec-title">${escHtml(rec.title)}</div>
                     <ol class="rec-steps">${steps}</ol>
                   </div>`;
        }
      }

      manualEl.innerHTML = html || `<p style="color:#6b7280">No recommendations available.</p>`;
    }

    runBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) return;

      // Reset UI
      logBox.innerHTML = "";
      resultEl.innerHTML = "";
      document.getElementById("manual-content").innerHTML = "";
      document.getElementById("manual-card").style.display = "none";
      logCard.style.display = "block";
      resultCard.style.display = "none";
      logTitle.innerHTML = `<span class="spinner" id="spinner"></span> Agent running…`;
      runBtn.disabled = true;

      const form = new FormData();
      form.append("file", file);
      form.append("provider", providerEl.value);
      form.append("model", modelEl.value);
      form.append("max_loops", document.getElementById("max-loops").value);
      form.append("python_version", document.getElementById("python-version").value);

      const resp = await fetch("/resolve", { method: "POST", body: form });
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const parts = buffer.split("\n\n");
        buffer = parts.pop(); // keep incomplete chunk

        for (const part of parts) {
          if (part.startsWith("event: done")) {
            runBtn.disabled = false;
            break;
          }
          if (part.startsWith("data: ")) {
            try {
              const data = JSON.parse(part.slice(6));
              if (data.type === "log") {
                appendLog(data.text);
              } else if (data.type === "result") {
                showResult(data);
                runBtn.disabled = false;
              }
            } catch (_) { }
          }
        }
      }
    });
  </script>
</body>

</html>
